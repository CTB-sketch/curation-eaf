<script>
"use strict";
/* ================================================================
   BACFRANÇAIS.IO — v4.7
   = v4.6 (dashboard complet + flux restaurables + découverte Radio France)
   + ROUTING YouTube via /api/youtube (yt:UC… → 50 vidéos)
   ================================================================ */

const Storage = {
  persistent: true, backend: 'supabase', _memData: null, _saveTimeout: null, _lastSavedJson: null,
  async init() {
    try {
      const resp = await fetch('/api/load-data');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const payload = await resp.json();
      if (payload && payload.state && payload.state.version === 3) { this._memData = payload.state; this._lastSavedJson = JSON.stringify(payload.state); return this._memData; }
      throw new Error('État Supabase invalide');
    } catch (e) { this.persistent = false; this.backend = 'memory'; return null; }
  },
  read() { return this._memData; },
  write(v) {
    this._memData = v;
    if (this._saveTimeout) clearTimeout(this._saveTimeout);
    this._saveTimeout = setTimeout(async () => {
      try {
        const json = JSON.stringify(v);
        if (json === this._lastSavedJson) return;
        const resp = await fetch('/api/save-data', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: json });
        if (resp.ok) this._lastSavedJson = json;
      } catch (e) { console.error('[Storage.write]', e); }
    }, 1000);
  },
  clear() { this._memData = null; this._lastSavedJson = null; }
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const nowISO = () => new Date().toISOString();
const fmtDT = iso => { const d = new Date(iso); return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }); };
const uid = () => Math.random().toString(36).slice(2, 10);

const OBJETS = { poesie: { l: 'Poésie', c: 'b-poesie' }, idees: { l: "Littérature d'idées", c: 'b-idees' }, roman: { l: 'Roman & récit', c: 'b-roman' }, theatre: { l: 'Théâtre', c: 'b-theatre' } };

const OEUVRES = [
 { id: 'rimbaud', titre: 'Cahiers de Douai', auteur: 'Rimbaud', objet: 'poesie', voie: 'G', parcours: "L'émancipation créatrice", statut: 'Au programme', session: '2025-2026', kw: ['cahiers de douai', 'rimbaud'] },
 { id: 'ponge', titre: "La Rage de l'expression", auteur: 'Francis Ponge', objet: 'poesie', voie: 'G', parcours: "Dans l'atelier du poète", statut: 'Au programme', session: '2025-2026', kw: ['rage de l\'expression', 'ponge'] },
 { id: 'dorion', titre: 'Mes Forêts', auteur: 'Hélène Dorion', objet: 'poesie', voie: 'G', parcours: 'La nature entre science et poésie', statut: 'Au programme', session: '2025-2026', kw: ['mes forêts', 'dorion'] },
 { id: 'laboetie', titre: 'Discours de la servitude volontaire', auteur: 'La Boétie', objet: 'idees', voie: 'G', parcours: 'Servitude et liberté', statut: 'Au programme', session: '2025-2026', kw: ['servitude volontaire', 'boétie', 'boetie'] },
 { id: 'gouges', titre: 'Déclaration des droits de la femme et de la citoyenne', auteur: 'Olympe de Gouges', objet: 'idees', voie: 'G', parcours: "Écrire et combattre pour l'égalité", statut: 'Au programme', session: '2025-2026', kw: ['droits de la femme', 'gouges'] },
 { id: 'labruyere', titre: 'Les Caractères (livres V à XI)', auteur: 'La Bruyère', objet: 'idees', voie: 'G', parcours: 'Peindre les Hommes, examiner la morale', statut: 'Au programme', session: '2025-2026', kw: ['les caractères', 'caracteres', 'bruyère', 'bruyere'] },
 { id: 'prevost', titre: 'Manon Lescaut', auteur: 'Abbé Prévost', objet: 'roman', voie: 'G', parcours: 'Personnages en marge, plaisirs du romanesque', statut: 'Au programme', session: '2025-2026', kw: ['manon lescaut', 'prévost', 'prevost'] },
 { id: 'balzac', titre: 'La Peau de chagrin', auteur: 'Balzac', objet: 'roman', voie: 'G', parcours: "Les romans de l'énergie : création et destruction", statut: 'Au programme', session: '2025-2026', kw: ['peau de chagrin', 'balzac'] },
 { id: 'colette', titre: 'Sido suivi de Les Vrilles de la vigne', auteur: 'Colette', objet: 'roman', voie: 'G', parcours: 'La célébration du monde', statut: 'Au programme', session: '2025-2026', kw: ['sido', 'vrilles de la vigne', 'colette'] },
 { id: 'corneille', titre: 'Le Menteur', auteur: 'Corneille', objet: 'theatre', voie: 'G', parcours: 'Mensonge et comédie', statut: 'Au programme', session: '2025-2026', kw: ['le menteur', 'corneille'] },
 { id: 'musset', titre: "On ne badine pas avec l'amour", auteur: 'Musset', objet: 'theatre', voie: 'G', parcours: 'Les jeux du cœur et de la parole', statut: 'Au programme', session: '2025-2026', kw: ['badine pas avec l\'amour', 'musset'] },
 { id: 'sarraute', titre: 'Pour un oui ou pour un non', auteur: 'Nathalie Sarraute', objet: 'theatre', voie: 'G', parcours: 'Théâtre et dispute', statut: 'Au programme', session: '2025-2026', kw: ['pour un oui ou pour un non', 'sarraute'] },
 { id: 'rabelais', titre: 'Gargantua', auteur: 'Rabelais', objet: 'idees', voie: 'T', parcours: 'La bonne éducation', statut: 'Au programme', session: '2025-2026', kw: ['gargantua', 'rabelais'] },

   COLLECTE — PATCH v4.7 : routing yt:UC… → /api/youtube
   ================================================================ */
function normFP(url, titre, src) { const u = (url || '').toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/+$/, '').replace(/[?#].*$/, ''); return u || ((titre || '') + '|' + (src || '')).toLowerCase(); }
function detectExercice(txt) { const t = (txt || '').toLowerCase(); if (/lecture lin|explication lin/.test(t)) return 'Explication linéaire'; if (/dissertation/.test(t)) return 'Dissertation'; if (/contraction/.test(t)) return 'Contraction (Techno)'; if (/essai/.test(t)) return 'Essai (Techno)'; return 'Analyse'; }
function matchOeuvres(c) { const hay = ((c.t || c.titre || '') + ' ' + (c.x || c.desc || '')).toLowerCase(); return OEUVRES.filter(o => o.kw.some(k => hay.indexOf(k) >= 0)).map(o => o.id); }
const oeuvreActive = id => { const o = OEUVRES.find(x => x.id === id); return o && o.statut !== 'Sortante (renouvellement)'; };
function composite(it) { const days = (Date.now() - new Date(it.date).getTime()) / 86400000; const frais = days < 30 ? 10 : days < 90 ? 8 : days < 180 ? 6 : days < 365 ? 4 : 2; const align = it.oeuvreIds.length ? (it.oeuvreIds.some(oeuvreActive) ? 10 : 5) : 3; return Math.round((frais * 0.3 + 8 * 0.2 + 6 * 0.2 + align * 0.2 + 8 * 0.1) * 10) / 10; }
function ingestCandidate(c, sourceId, run) {
  const fp = normFP(c.url, c.titre, sourceId);
  if (DB.fingerprints[fp]) { run.doublons++; return; }
  const oeuvreIds = matchOeuvres({ t: c.titre, x: c.desc || '' });
  DB.fingerprints[fp] = true;
  const it = { id: uid(), ts: nowISO(), titre: c.titre, source: sourceId, url: c.url, format: c.format || 'Flux', desc: (c.desc || '').slice(0, 160), date: (c.date || nowISO()).slice(0, 10), exercice: detectExercice(c.titre + ' ' + (c.desc || '')), oeuvreIds, objets: [...new Set(oeuvreIds.map(id => OEUVRES.find(o => o.id === id).objet))], voies: [...new Set(oeuvreIds.map(id => OEUVRES.find(o => o.id === id).voie))], statut: 'candidate', runId: run.id, obsolete: false, hist: [] };
  it.score = composite(it); DB.inbox.push(it); run.nouveaux++; if (!oeuvreIds.length) run.nonIdentifies++;
}
function runCollectSimulee(trigger) {
  const run = { id: uid(), ts: nowISO(), trigger, items: POOL.length, nouveaux: 0, doublons: 0, nonIdentifies: 0 };
  POOL.forEach(c => ingestCandidate({ titre: c.t, url: c.u, desc: c.x, date: c.d, format: c.f }, c.s, run));
  DB.collectes.unshift(run);
  audit('Collecte simulée (' + trigger + ')', run.nouveaux + ' nouveaux, ' + run.doublons + ' doublons.');
  toast('Collecte simulée : ' + run.nouveaux + ' nouveaux, ' + run.doublons + ' doublons écartés.', 'ok');
  save(); refreshCounts(); render();
}

/* ✅ PATCH : buildApiUrl route vers /api/youtube si préfixe "yt:" */
function buildApiUrl(src) {
  if (src.feed.startsWith('yt:')) {
    return '/api/youtube?channel=' + encodeURIComponent(src.feed.slice(3)) + '&limit=50';
  }
  return '/api/collect?feed=' + encodeURIComponent(src.feed) + '&limit=50';
}

async function runCollect(trigger) {
  if (!can('collect')) { toast('Rôle insuffisant.', 'err'); return; }
  if (DB.settings.testMode) return runCollectSimulee(trigger);
  const run = { id: uid(), ts: nowISO(), trigger, items: 0, nouveaux: 0, doublons: 0, nonIdentifies: 0 };
  let feedsOk = 0, feedsKo = 0, ytOk = 0, ytKo = 0, rssOk = 0, rssKo = 0;
  const actives = (DB.sources || []).filter(s => s.actif !== false);
  if (actives.length === 0) { toast('Aucun flux actif. Onglet 📡 Flux RSS.', 'err'); return; }
  for (const src of actives) {
    const isYt = src.feed.startsWith('yt:');
    try {
      const resp = await fetch(buildApiUrl(src));
      const data = await resp.json();
      if (data.error || !data.items) {
        feedsKo++; if (isYt) ytKo++; else rssKo++;
        log('Flux en échec : ' + src.nom + ' (' + (data.error || 'vide') + ')', 'warn');
        continue;
      }
      feedsOk++; if (isYt) ytOk++; else rssOk++;
      run.items += data.items.length;
      data.items.forEach(it => ingestCandidate({ titre: it.titre, url: it.url, desc: it.desc, date: it.date }, src.id, run));
    } catch (e) {
      feedsKo++; if (isYt) ytKo++; else rssKo++;
      log('Erreur flux : ' + src.nom + ' (' + e.message + ')', 'err');
    }
  }
  DB.collectes.unshift(run);
  const detail = run.nouveaux + ' nouveaux · ' + rssOk + ' flux RSS OK (' + rssKo + ' ko) · ' + ytOk + ' chaînes YT OK (' + ytKo + ' ko)';
  audit('Collecte RÉELLE (' + trigger + ')', detail);
  toast('Collecte réelle : ' + run.nouveaux + ' nouveaux (' + detail + ').', feedsKo > 0 ? 'err' : 'ok');
  save(); refreshCounts(); render();
}

/* ---------- GESTION DES FLUX ---------- */
function testFeed(feedUrl) {
  const api = feedUrl.startsWith('yt:')
    ? '/api/youtube?channel=' + encodeURIComponent(feedUrl.slice(3)) + '&limit=50'
    : '/api/collect?feed=' + encodeURIComponent(feedUrl) + '&limit=50';
  return fetch(api).then(r => r.json()).then(d => {
    if (d.error) return { ok: false, error: d.error };
    if (!d.items || d.items.length === 0) return { ok: false, error: 'Flux vide' };
    return { ok: true, count: d.items.length, titre: d.titre || '(flux)' };
  }).catch(e => ({ ok: false, error: e.message }));
}
function addFeed() {
  if (!can('feeds')) { toast('Rôle insuffisant.', 'err'); return; }
  const nom = $('#newFeedNom').value.trim(), feed = $('#newFeedUrl').value.trim();
  if (!nom || !feed) { toast('Nom et URL requis.', 'err'); return; }
  /* ✅ Validation élargie : http(s):// ou yt:UC… */
  if (!/^https?:\/\//i.test(feed) && !/^yt:UC[a-zA-Z0-9_-]{20,26}$/.test(feed)) {
    toast('URL invalide : doit commencer par http(s):// ou yt:UC… (ID de chaîne YouTube).', 'err'); return;
  }
  DB.sources.push({ id: 'feed-' + uid(), nom, feed, actif: true });
  audit('Flux ajouté', '« ' + nom + ' » (' + (feed.startsWith('yt:') ? 'YouTube API' : 'RSS') + ')');
  toast('Flux « ' + nom + ' » ajouté. Testez-le.', 'ok');
  $('#newFeedNom').value = ''; $('#newFeedUrl').value = '';
  save(); render();
}
function removeFeed(id) {

function toggleFeed(id) {

function moveItem(id, to) {
  const it = DB.inbox.find(x => x.id === id); if (!it) return;
  const tr = (TRANSITIONS[it.statut] || []).find(t => t.to === to); if (!tr) return;
  if (!can(tr.perm)) { toast('Rôle insuffisant.', 'err'); return; }
  const from = it.statut; it.statut = to;
  it.hist.push({ ts: nowISO(), from, to, user: roleName[DB.role] });
  audit('Workflow', '« ' + it.titre + ' » : ' + STATUT_LABEL[from] + ' → ' + STATUT_LABEL[to]);
  save(); toast('« ' + it.titre + ' » → ' + STATUT_LABEL[to] + '.', 'ok'); render();
}

/* ---------- PLANIFICATEUR ---------- */
let schedTimer = null, countTimer = null;
async function scheduledTick() {
  log('⏰ Exécution planifiée.', 'info');
  if (DB.settings.autoCollect) await runCollect('programmée');
  if (DB.settings.autoLinks) await runLinkCheck(12);
  DB.settings.nextRun = Date.now() + DB.settings.freq * 60000;
  save(); updateSchedUI();
}
function startSched() {
  stopSched(); DB.settings.actif = true; DB.settings.nextRun = Date.now() + DB.settings.freq * 60000;
  schedTimer = setInterval(scheduledTick, DB.settings.freq * 60000); countTimer = setInterval(updateSchedUI, 1000);
  audit('Planificateur', 'Activé (' + DB.settings.freq + ' min).');
  save(); updateSchedUI(); toast('Planificateur activé.', 'ok');
}
function stopSched() { if (schedTimer) clearInterval(schedTimer); if (countTimer) clearInterval(countTimer); schedTimer = null; countTimer = null; DB.settings.actif = false; DB.settings.nextRun = null; save(); updateSchedUI(); }
function updateSchedUI() {
  const mini = $('#schedMini'); if (!mini) return;
  if (DB.settings.actif && DB.settings.nextRun) {
    const s = Math.max(0, Math.floor((DB.settings.nextRun - Date.now()) / 1000));
    mini.innerHTML = 'Planificateur : <b>actif</b> · <b>' + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') + '</b>';
    const cd = $('#countdown'); if (cd) cd.textContent = 'Prochaine exécution dans ' + Math.floor(s / 60) + ' min ' + (s % 60) + ' s';
  } else { mini.innerHTML = 'Planificateur : <b>arrêté</b>'; const cd = $('#countdown'); if (cd) cd.textContent = 'Planificateur arrêté.'; }
}

/* ---------- DIGEST ---------- */
function buildDigest() {
  const pubs = DB.inbox.filter(i => i.statut === 'publiee');
  let md = '# Digest EAF — ' + new Date().toLocaleDateString('fr-FR') + '\n\nProgramme : ' + DB.settings.currentProgram + ' · ' + pubs.length + ' analyses publiées.\n\n';
  OEUVRES.forEach(o => { const items = pubs.filter(i => i.oeuvreIds.indexOf(o.id) >= 0); if (items.length) { md += '## ' + o.titre + ' (' + o.auteur + ')\n'; items.forEach(i => { md += '- [' + i.titre + '](' + i.url + ')\n'; }); md += '\n'; } });
  const sans = OEUVRES.filter(o => !pubs.some(i => i.oeuvreIds.indexOf(o.id) >= 0));
  if (sans.length) md += '## Œuvres sans analyse publiée\n' + sans.map(o => '- ' + o.titre + ' (' + o.auteur + ')\n').join('') + '\n';
  return md;
}

/* ================================================================
   DIAGNOSTIC (v4.7 : ajoute le test /api/youtube)
   ================================================================ */
async function runDiagnostics() {
  const box = $('#diagResults'); if (!box) return;
  const btn = $('#btnDiag'); if (btn) btn.disabled = true;
  const res = [];
  const add = (name, ok, detail) => { res.push({ name, ok, detail }); box.innerHTML = res.map(r => '<div class="diag-row"><span class="diag-ico ' + (r.ok ? 'diag-ok' : 'diag-ko') + '">' + (r.ok ? '✓' : '✗') + '</span><b>' + esc(r.name) + '</b><span class="muted small" style="margin-left:auto">' + esc(r.detail) + '</span></div>').join(''); };
  add('Référentiel œuvres', OEUVRES.length === 16, OEUVRES.length + ' œuvres');
  add('Whitelist liens', DB.liens.length >= 20, DB.liens.length + ' liens');
  add('Liste des flux RSS', Array.isArray(DB.sources) && DB.sources.length > 0, (DB.sources || []).length + ' flux');
  try { const r = await fetch('/api/load-data'); if (!r.ok) throw new Error('HTTP ' + r.status); const d = await r.json(); add('Connectivité Supabase', d && d.state && d.state.version === 3, 'état chargé'); } catch (e) { add('Connectivité Supabase', false, e.message); }
  try { const r = await fetch('/api/check-link?url=' + encodeURIComponent('https://example.com')); const d = await r.json(); add('/api/check-link', d && typeof d.ok === 'boolean', d.ok ? 'répond' : 'erreur'); } catch (e) { add('/api/check-link', false, e.message); }
  try {
    const act = (DB.sources || []).filter(s => s.actif !== false && !s.feed.startsWith('yt:'));
    if (!act.length) add('/api/collect (flux RSS)', false, 'aucun flux RSS actif');
    else {
      let ok = 0, ko = 0, firstErr = '';
      for (const s of act) {
        const r = await fetch('/api/collect?feed=' + encodeURIComponent(s.feed) + '&limit=50');
        const d = await r.json();
        if (d && !d.error && d.items && d.items.length > 0) ok++; else { ko++; if (!firstErr) firstErr = (d && d.error) || 'vide'; }
      }
      add('/api/collect (flux RSS)', ok > 0, ok + '/' + act.length + ' OK' + (ko ? ' · ex: ' + firstErr : ''));
    }
  } catch (e) { add('/api/collect (flux RSS)', false, e.message); }
  /* ✅ NOUVEAU test : /api/youtube */
  try {
    const ytSources = (DB.sources || []).filter(s => s.actif !== false && s.feed.startsWith('yt:'));
    if (!ytSources.length) add('/api/youtube (chaînes YT)', null, 'aucune chaîne configurée (ok si non utilisée)');
    else {
      let ok = 0, ko = 0, firstErr = '';
      for (const s of ytSources) {
        const r = await fetch('/api/youtube?channel=' + encodeURIComponent(s.feed.slice(3)) + '&limit=10');
        const d = await r.json();
        if (d && !d.error && d.items && d.items.length > 0) ok++; else { ko++; if (!firstErr) firstErr = d && d.error ? d.error : 'vide'; }
      }
      add('/api/youtube (chaînes YT)', ok > 0, ok + '/' + ytSources.length + ' chaînes OK' + (ko ? ' · ex: ' + firstErr : ''));
    }
  } catch (e) { add('/api/youtube (chaînes YT)', false, e.message); }
  const prevMode = DB.settings.testMode; DB.settings.testMode = true;
  if (DB.liens.length > 0) { const l = DB.liens[0]; const r = await checkLink(l); add('Contrôle lien (simulation)', r === 'responds' || r === 'error', 'retour : ' + r); }
  DB.settings.testMode = prevMode; save();
  const md = buildDigest(); add('Digest', md.indexOf('Digest EAF') >= 0, 'Markdown produit');
  const okN = res.filter(x => x.ok).length;
  toast('Diagnostic : ' + okN + '/' + res.length + ' tests réussis.', okN === res.length ? 'ok' : 'err');
  if (btn) btn.disabled = false;
}

let inboxFiltre = 'actives';
function viewCollecte() {
  const order = { candidate: 0, en_revue: 1, validee: 2, publiee: 3, rejetee: 4, dupliquee: 5 };
  let items = [...DB.inbox].sort((a, b) => order[a.statut] - order[b.statut] || b.ts.localeCompare(a.ts));
  if (inboxFiltre === 'actives') items = items.filter(i => ['candidate', 'en_revue', 'validee', 'publiee'].indexOf(i.statut) >= 0);
  if (inboxFiltre === 'candidate') items = items.filter(i => i.statut === 'candidate');
  if (inboxFiltre === 'publiee') items = items.filter(i => i.statut === 'publiee');
  if (inboxFiltre === 'ecartees') items = items.filter(i => ['rejetee', 'dupliquee'].indexOf(i.statut) >= 0);
  const sources = DB.sources || [];
  const ytActive = sources.filter(s => s.actif !== false && s.feed.startsWith('yt:')).length;
  const rssActive = sources.filter(s => s.actif !== false && !s.feed.startsWith('yt:')).length;
  return '<div class="filters">' +
    '<button class="chipbtn ' + (inboxFiltre === 'actives' ? 'on' : '') + '" data-if="actives">Actives</button>' +
    '<button class="chipbtn ' + (inboxFiltre === 'candidate' ? 'on' : '') + '" data-if="candidate">Candidates</button>' +
    '<button class="chipbtn ' + (inboxFiltre === 'publiee' ? 'on' : '') + '" data-if="publiee">Publiées</button>' +
    '<button class="chipbtn ' + (inboxFiltre === 'ecartees' ? 'on' : '') + '" data-if="ecartees">Écartées</button>' +
    '<span style="flex:1"></span><button class="btn btn--red btn--sm" id="btnCollectNow2">⚡ Lancer une collecte</button></div>' +
    '<div class="hint">Mode : <b>' + (DB.settings.testMode ? 'SIMULATION' : 'RÉEL (' + rssActive + ' flux RSS + ' + ytActive + ' chaînes YT API → 50 vidéos/chaîne)') + '</b></div>' +
    (items.length === 0 ? '<div class="empty">Aucun élément.</div>' : items.map(itemCard).join('')) +
    '<h2 class="section">Historique des collectes</h2><div class="card" style="padding:0;overflow-x:auto"><table class="tbl"><thead><tr><th>Date</th><th>Déclencheur</th><th>Nouveaux</th><th>Doublons</th></tr></thead><tbody>' +
    (DB.collectes.map(c => '<tr><td class="mono">' + fmtDT(c.ts) + '</td><td>' + esc(c.trigger) + '</td><td><b>' + c.nouveaux + '</b></td><td>' + c.doublons + '</td></tr>').join('') || '<tr><td colspan="4" class="muted">Aucune.</td></tr>') + '</tbody></table></div>';
}
function itemCard(it) {
  const objBadges = it.objets.map(o => '<span class="b ' + OBJETS[o].c + '">' + OBJETS[o].l + '</span>').join(' ');
  const oeuvreTags = it.oeuvreIds.map(id => { const o = OEUVRES.find(x => x.id === id); return '<span class="b b-teal">📖 ' + esc(o.titre) + '</span>'; }).join(' ') || '<span class="b b-gold">⚠ non identifiée</span>';
  const trs = (TRANSITIONS[it.statut] || []).map(t => '<button class="btn btn--sm ' + t.cls + '" data-move="' + it.id + '" data-to="' + t.to + '"' + (can(t.perm) ? '' : ' disabled') + '>' + t.label + '</button>').join('');
  return '<div class="card item st-' + it.statut + '"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span class="b ' + STATUT_BADGE[it.statut] + '">' + STATUT_LABEL[it.statut] + '</span><span class="b b-outline">' + esc(it.format) + '</span>' + objBadges + '<span class="b b-ink">Score ' + it.score + '</span>' + (it.obsolete ? '<span class="b b-orange"> Obsolète</span>' : '') + '</div>' +
    '<h3 class="h" style="margin-top:8px">' + esc(it.titre) + '</h3><p class="small muted">' + esc(it.desc) + '</p>' +
    '<div style="margin-top:7px">' + oeuvreTags + '</div>' +
    '<div class="actions-row">' + trs + ' <a class="btn btn--ghost btn--sm" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">↗ Ouvrir</a></div></div>';
}

function viewCouverture() {
  return '<div class="grid grid-3">' + OEUVRES.map(o => { const n = DB.inbox.filter(i => i.statut === 'publiee' && i.oeuvreIds.indexOf(o.id) >= 0).length; const cls = n === 0 ? 'cov-red' : (n < 3 ? 'cov-orange' : 'cov-green'); return '<div class="cov-cell ' + cls + '"><b>' + n + '</b><span class="small"><b>' + esc(o.titre) + '</b></span></div>'; }).join('') + '</div>';
}
function viewWorkflow() {
  return '<div class="card" style="padding:0;overflow-x:auto"><table class="tbl"><thead><tr><th>Horodatage</th><th>Rôle</th><th>Action</th><th>Détails</th></tr></thead><tbody>' +
    [...DB.audit].reverse().map(a => '<tr><td class="mono small">' + fmtDT(a.ts) + '</td><td>' + esc(a.user) + '</td><td><b>' + esc(a.action) + '</b></td><td class="small muted">' + esc(a.details) + '</td></tr>').join('') + '</tbody></table></div>';
}
function viewDigest() {
  return '<div style="display:flex;gap:10px;margin-bottom:14px"><button class="btn btn--red" id="btnDigest">📰 Générer</button><button class="btn btn--ghost" id="btnCopyDigest">⧉ Copier</button></div><div class="card" id="digestBox"><p class="muted small">Cliquez sur « Générer ».</p></div>';
}
function renderDigest() { const box = $('#digestBox'); if (box) box.innerHTML = '<pre style="white-space:pre-wrap;font-size:12px">' + esc(buildDigest()) + '</pre>'; }
function viewRapports() {
  return '<div class="grid grid-2"><div class="card"><h3 class="h">🚨 Signaler</h3>' +
    '<div class="field"><label>Ressource</label><select id="rappLink">' + DB.liens.map(l => '<option value="' + l.id + '">' + esc(l.titre) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>Description</label><textarea id="rappMsg" rows="3"></textarea></div>' +
    '<button class="btn btn--red" id="btnRapp">Envoyer</button></div>' +
    '<div class="card"><h3 class="h">Modération</h3>' + (DB.rapports.length === 0 ? '<p class="muted small">Aucun.</p>' : DB.rapports.map(r => '<div class="kv"><span>' + esc(r.type) + ' — ' + esc(r.msg) + '</span><span>' + (r.statut === 'ouvert' ? '<button class="btn btn--green btn--sm" data-rappok="' + r.id + '">Traité</button>' : esc(r.statut)) + '</span></div>').join('')) + '</div></div>';
}
function viewCandidats() {
  const pend = DB.candidats.filter(c => c.statut === 'pendant');
  return '<button class="btn btn--red" id="btnDetectSources" style="margin-bottom:14px">🔍 Détecter</button>' +
    (pend.length === 0 ? '<div class="empty">Aucune.</div>' : pend.map(c => '<div class="card"><b>' + esc(c.nom) + '</b> <span class="b b-ink">' + c.score + '</span><p class="small muted">' + esc(c.raison) + '</p><div class="actions-row"><button class="btn btn--green btn--sm" data-approve="' + c.id + '">✓</button><button class="btn btn--ghost btn--sm" data-refuse="' + c.id + '">✕</button></div></div>').join(''));
}
function viewDiagnostic() {
  return '<div class="card"><button class="btn btn--red" id="btnDiag">▶ Lancer les tests</button><div id="diagResults" style="margin-top:14px"></div></div>';
}
function viewSecurite() {
  const disI = can('import') ? '' : ' disabled', disR = can('reset') ? '' : ' disabled';
  const sources = DB.sources || [];
  return '<div class="card"><h3 class="h">💾 Données</h3><div style="display:flex;gap:10px"><button class="btn btn--green" id="btnExport">⤓ Exporter</button><button class="btn btn--ghost" id="btnImport"' + disI + '>⤒ Importer</button><button class="btn btn--red" id="btnReset"' + disR + '>⟲ Réinitialiser</button><input type="file" id="fileImport" accept=".json" hidden></div>' +
    '<div class="kv" style="margin-top:12px"><span>Flux RSS</span><b>' + sources.filter(s => !s.feed.startsWith('yt:')).length + '</b></div>' +
    '<div class="kv"><span>Chaînes YouTube (API)</span><b>' + sources.filter(s => s.feed.startsWith('yt:')).length + '</b></div>' +
    '<div class="kv"><span>Audit</span><b>' + DB.audit.length + '</b></div></div>';
}

function exportJSON() { const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'curation-eaf-v47.json'; a.click(); URL.revokeObjectURL(a.href); toast('Export téléchargé.', 'ok'); }
function importJSON(file) { if (!file) return; const rd = new FileReader(); rd.onload = function () { try { const o = JSON.parse(rd.result); if (!o || o.version !== 3 || !o.liens) throw 0; DB = normalizeState(o); save(); toast('Import réussi.', 'ok'); refreshCounts(); render(); } catch (e) { toast('Fichier invalide.', 'err'); } }; rd.readAsText(file); }

function setupListeners() {
  $('#nav').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
  $('#rolePick').addEventListener('change', e => { DB.role = e.target.value; save(); toast('Rôle : ' + roleName[DB.role]); render(); });
  $('#btnCollectNow').addEventListener('click', () => runCollect('manuelle'));
  $('#btnLinksNow').addEventListener('click', () => runLinkCheck(12));

  document.addEventListener('click', e => {
    try {
      let el;
      if ((el = e.target.closest('[data-move]'))) { moveItem(el.dataset.move, el.dataset.to); return; }
      if ((el = e.target.closest('[data-test]'))) { const l = DB.liens.find(x => x.id === el.dataset.test); if (l) checkLink(l).then(() => { save(); renderLiensTable(); }); return; }
      if ((el = e.target.closest('[data-lf]'))) { lienFiltre = el.dataset.lf; render(); return; }
      if ((el = e.target.closest('[data-if]'))) { inboxFiltre = el.dataset.if; render(); return; }
      if ((el = e.target.closest('[data-rappok]'))) { const r = DB.rapports.find(x => x.id === el.dataset.rappok); if (r) { r.statut = 'traité'; save(); render(); } return; }
      if ((el = e.target.closest('[data-approve]'))) { approveSource(el.dataset.approve, true); return; }
      if ((el = e.target.closest('[data-refuse]'))) { approveSource(el.dataset.refuse, false); return; }
      if (e.target.closest('#btnAddFeed')) { addFeed(); return; }
      if (e.target.closest('#btnTestAllFeeds')) { testAllFeeds(); return; }
      if (e.target.closest('#btnRestoreFeeds')) { restoreDefaultFeeds(); return; }
      if ((el = e.target.closest('[data-remove-feed]'))) { removeFeed(el.dataset.removeFeed); return; }
      if ((el = e.target.closest('[data-test-feed]'))) { testFeedUI(el.dataset.testFeed); return; }
      if (e.target.closest('#btnCheckLot')) { runLinkCheck(12); return; }
      if (e.target.closest('#btnCollectNow2')) { runCollect('manuelle'); return; }
      if (e.target.closest('#btnStartSched')) { const fi = $('#freqInput'); DB.settings.freq = Math.max(1, parseInt(fi ? fi.value : DB.settings.freq, 10) || 30); startSched(); render(); return; }
      if (e.target.closest('#btnStopSched')) { stopSched(); render(); return; }
      if (e.target.closest('#btnWatchBO')) { watchBO(); return; }
      if (e.target.closest('#btnDetectSources')) { detectSources(); return; }
      if (e.target.closest('#btnDigest')) { DB.settings.lastDigest = nowISO(); save(); renderDigest(); toast('Digest généré.', 'ok'); return; }
      if (e.target.closest('#btnCopyDigest')) { navigator.clipboard.writeText(buildDigest()).then(() => toast('Copié.', 'ok'), () => toast('Copie impossible.', 'err')); return; }
      if (e.target.closest('#btnRapp')) { const msg = $('#rappMsg').value.trim(); if (!msg) { toast('Description requise.', 'err'); return; } DB.rapports.unshift({ id: uid(), ts: nowISO(), linkId: $('#rappLink').value, type: 'Signalement', msg, by: roleName[DB.role], statut: 'ouvert' }); save(); render(); toast('Signalement enregistré.', 'ok'); return; }
      if (e.target.closest('#btnDiag')) { runDiagnostics(); return; }
      if (e.target.closest('#btnExport')) { exportJSON(); return; }
      if (e.target.closest('#btnImport')) { if (can('import')) $('#fileImport').click(); return; }
      if (e.target.closest('#btnReset')) { if (can('reset') && confirm('Réinitialiser ?')) { DB = seed(); save(); render(); refreshCounts(); } return; }
    } catch (err) { toast('Erreur : ' + err.message, 'err'); }
  });

  document.addEventListener('change', e => {
    try {
      if (e.target.id === 'swCollect') { DB.settings.autoCollect = e.target.checked; save(); }
      if (e.target.id === 'swLinks') { DB.settings.autoLinks = e.target.checked; save(); }
      if (e.target.id === 'swTestMode') { DB.settings.testMode = e.target.checked; save(); toast('Mode ' + (e.target.checked ? 'Simulation' : 'Réseau réel') + '.'); }
      if (e.target.id === 'freqInput') { DB.settings.freq = Math.max(1, parseInt(e.target.value, 10) || 30); save(); if (DB.settings.actif) startSched(); }
      let el;
      if ((el = e.target.closest('[data-toggle-feed]'))) { toggleFeed(el.dataset.toggleFeed); }
      if (e.target.id === 'fileImport') { importJSON(e.target.files[0]); e.target.value = ''; }
    } catch (err) { toast('Erreur : ' + err.message, 'err'); }
  });
}

function normalizeState(saved) {
  const base = seed();
  const st = Object.assign({}, base, saved || {});
  st.settings = Object.assign({}, base.settings, (saved && saved.settings) || {});
  if (!Array.isArray(st.liens) || st.liens.length === 0) st.liens = base.liens;
  if (!Array.isArray(st.inbox)) st.inbox = [];
  if (!Array.isArray(st.collectes)) st.collectes = [];
  if (!Array.isArray(st.watch)) st.watch = [];
  if (!Array.isArray(st.candidats)) st.candidats = [];
  if (!Array.isArray(st.rapports)) st.rapports = [];
  if (!Array.isArray(st.audit) || st.audit.length === 0) st.audit = base.audit;
  if (!Array.isArray(st.log)) st.log = [];
  if (!st.fingerprints || typeof st.fingerprints !== 'object') st.fingerprints = {};
  if (!st.role) st.role = 'admin';
  if (!Array.isArray(st.sources) || st.sources.length === 0) st.sources = clone(DEFAULT_FEEDS);
  st.version = 3;
  return st;
}

(async function () {
  try {
    setupListeners();
    console.log('[INIT] 🚀 v4.7 démarrage...');
    const saved = await Storage.init();
    DB = (saved && saved.version === 3) ? normalizeState(saved) : seed();
    Storage.write(DB);
    $('#rolePick').value = DB.role;
    updateStorageTag(); refreshCounts(); setView('dashboard');
    if (DB.settings.actif) { DB.settings.actif = false; save(); }
    console.log('[INIT] ✅ Application prête (v4.7)');
  } catch (err) {
    console.error('[INIT] ❌', err);
    document.getElementById('view').innerHTML = '<div class="fatal"><h2>⚠️ Erreur d\'initialisation</h2><p>' + esc(err.message) + '</p><button class="btn btn--red" onclick="location.reload()">⟲ Réessayer</button></div>';
  }
})();
</script>
</body>
</html>
