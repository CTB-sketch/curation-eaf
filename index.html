<script>
"use strict";
/* ================================================================
   BACFRANÇAIS.IO — CONSOLE DE CURATION EAF · v4.4
   Éditeur de flux RSS intégré + Supabase + collecte réelle
   ================================================================ */

/* ---------- 1. STOCKAGE SUPABASE ---------- */
const Storage = {
  persistent: true,
  backend: 'supabase',
  _memData: null,
  _saveTimeout: null,
  _lastSavedJson: null,

  async init() {
    console.log('[Storage.init] 🔄 Chargement depuis Supabase...');
    try {
      const resp = await fetch('/api/load-data');
      console.log('[Storage.init] Réponse HTTP reçue :', resp.status, resp.statusText);
      if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + resp.statusText);
      const payload = await resp.json();
      console.log('[Storage.init] Payload reçu :', payload);
      if (payload && payload.state && payload.state.version === 3) {
        this._memData = payload.state;
        this._lastSavedJson = JSON.stringify(payload.state);
        console.log('[Storage.init] ✅ État chargé avec succès depuis Supabase');
        return this._memData;
      }
      throw new Error('État Supabase invalide (version manquante ou != 3)');
    } catch (e) {
      console.warn('[Storage.init] ❌ Supabase indisponible, fallback mémoire :', e.message);
      this.persistent = false;
      this.backend = 'memory';
      return null;
    }
  },

  read() { return this._memData; },

  write(v) {
    console.log('[Storage.write] 📝 Sauvegarde programmée (debounce 1s)...');
    this._memData = v;
    if (this._saveTimeout) clearTimeout(this._saveTimeout);
    this._saveTimeout = setTimeout(async () => {
      try {
        const json = JSON.stringify(v);
        if (json === this._lastSavedJson) {
          console.log('[Storage.write] ⚠️ Pas de changement détecté, sauvegarde ignorée');
          return;
        }
        console.log('[Storage.write] 📤 Envoi vers /api/save-data... (taille JSON :', json.length, 'octets)');
        const resp = await fetch('/api/save-data', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: json
        });
        console.log('[Storage.write] Réponse HTTP :', resp.status, resp.statusText);
        if (resp.ok) {
          this._lastSavedJson = json;
          console.log('[Storage.write] ✅ Sauvegarde réussie dans Supabase');
        } else {
          console.error('[Storage.write] ❌ Sauvegarde échouée : HTTP ' + resp.status);
          const errText = await resp.text();
          console.error('[Storage.write] Détails de l\'erreur :', errText);
        }
      } catch (e) {
        console.error('[Storage.write] ❌ Erreur réseau ou exception :', e);
      }
    }, 1000);
  },

  clear() { this._memData = null; this._lastSavedJson = null; }
};

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nowISO = () => new Date().toISOString();
const fmtDT = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' }) + ' ' +
         d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
};
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------- 2. DONNÉES DE RÉFÉRENCE ---------- */
const OBJETS = {
  poesie: { l: 'Poésie', c: 'b-poesie' },
  idees:  { l: "Littérature d'idées", c: 'b-idees' },
  roman:  { l: 'Roman & récit', c: 'b-roman' },
  theatre:{ l: 'Théâtre', c: 'b-theatre' }
};

const OEUVRES = [
 { id: 'rimbaud', titre: 'Cahiers de Douai', auteur: 'Rimbaud', objet: 'poesie', voie: 'G', parcours: "L'émancipation créatrice", statut: 'Au programme', session: '2025-2026', kw: ['cahiers de douai', 'rimbaud'] },
 { id: 'ponge', titre: 'La Rage de l\'expression', auteur: 'Francis Ponge', objet: 'poesie', voie: 'G', parcours: "Dans l'atelier du poète", statut: 'Au programme', session: '2025-2026', kw: ['rage de l\'expression', 'ponge'] },
 { id: 'dorion', titre: 'Mes Forêts', auteur: 'Hélène Dorion', objet: 'poesie', voie: 'G', parcours: 'La nature entre science et poésie', statut: 'Au programme', session: '2025-2026', kw: ['mes forêts', 'dorion'] },
 { id: 'laboetie', titre: 'Discours de la servitude volontaire', auteur: 'La Boétie', objet: 'idees', voie: 'G', parcours: 'Servitude et liberté', statut: 'Au programme', session: '2025-2026', kw: ['servitude volontaire', 'boétie', 'boetie'] },
 { id: 'gouges', titre: 'Déclaration des droits de la femme et de la citoyenne', auteur: 'Olympe de Gouges', objet: 'idees', voie: 'G', parcours: "Écrire et combattre pour l'égalité", statut: 'Au programme', session: '2025-2026', kw: ['droits de la femme', 'gouges'] },
 { id: 'labruyere', titre: 'Les Caractères (livres V à XI)', auteur: 'La Bruyère', objet: 'idees', voie: 'G', parcours: 'Peindre les Hommes, examiner la morale', statut: 'Au programme', session: '2025-2026', kw: ['les caractères', 'caracteres', 'bruyère', 'bruyere'] },
 { id: 'prevost', titre: 'Manon Lescaut', auteur: 'Abbé Prévost', objet: 'roman', voie: 'G', parcours: 'Personnages en marge, plaisirs du romanesque', statut: 'Au programme', session: '2025-2026', kw: ['manon lescaut', 'prévost', 'prevost'] },
 { id: 'balzac', titre: 'La Peau de chagrin', auteur: 'Balzac', objet: 'roman', voie: 'G', parcours: "Les romans de l'énergie : création et destruction", statut: 'Au programme', session: '2025-2026', kw: ['peau de chagrin', 'balzac'] },

/* ---------- 5. COLLECTE / ÉTIQUETAGE / DÉDOUBLONNAGE / SCORE ---------- */
function normFP(url, titre, src) {
  const u = (url || '').toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/+$/, '').replace(/[?#].*$/, '');
  return u || ((titre || '') + '|' + (src || '')).toLowerCase();
}
function detectExercice(txt) {
  const t = (txt || '').toLowerCase();
  if (/lecture lin|explication lin/.test(t)) return 'Explication linéaire';
  if (/dissertation/.test(t)) return 'Dissertation';
  if (/contraction/.test(t)) return 'Contraction (Techno)';
  if (/essai/.test(t)) return 'Essai (Techno)';
  return 'Analyse';
}
function matchOeuvres(c) {
  const hay = ((c.t || c.titre || '') + ' ' + (c.x || c.desc || '')).toLowerCase();
  return OEUVRES.filter(o => o.kw.some(k => hay.indexOf(k) >= 0)).map(o => o.id);
}
const oeuvreActive = id => { const o = OEUVRES.find(x => x.id === id); return o && o.statut !== 'Sortante (renouvellement)'; };
function composite(it) {
  const days = (Date.now() - new Date(it.date).getTime()) / 86400000;
  const frais = days < 30 ? 10 : days < 90 ? 8 : days < 180 ? 6 : days < 365 ? 4 : 2;
  const sig = 6;
  const align = it.oeuvreIds.length ? (it.oeuvreIds.some(oeuvreActive) ? 10 : 5) : 3;
  return Math.round((frais * 0.3 + 8 * 0.2 + sig * 0.2 + align * 0.2 + 8 * 0.1) * 10) / 10;
}

function ingestCandidate(c, sourceId, run) {
  const fp = normFP(c.url, c.titre, sourceId);
  if (DB.fingerprints[fp]) { run.doublons++; return; }
  const oeuvreIds = matchOeuvres({ t: c.titre, x: c.desc || '' });
  DB.fingerprints[fp] = true;
  const it = {
    id: uid(), ts: nowISO(), titre: c.titre, source: sourceId, url: c.url,
    format: c.format || 'Flux', desc: (c.desc || '').slice(0, 160),
    date: (c.date || nowISO()).slice(0, 10),
    exercice: detectExercice(c.titre + ' ' + (c.desc || '')), oeuvreIds,
    objets: [...new Set(oeuvreIds.map(id => OEUVRES.find(o => o.id === id).objet))],
    voies: [...new Set(oeuvreIds.map(id => OEUVRES.find(o => o.id === id).voie))],
    statut: 'candidate', runId: run.id, obsolete: false, hist: []
  };
  it.score = composite(it);
  DB.inbox.push(it);
  run.nouveaux++;
  if (!oeuvreIds.length) run.nonIdentifies++;
}

function runCollectSimulee(trigger) {
  const run = { id: uid(), ts: nowISO(), trigger, items: POOL.length, nouveaux: 0, doublons: 0, nonIdentifies: 0 };
  POOL.forEach(c => { ingestCandidate({ titre: c.t, url: c.u, desc: c.x, date: c.d, format: c.f }, c.s, run); });
  DB.collectes.unshift(run);
  audit('Collecte simulée (' + trigger + ')', run.nouveaux + ' nouveaux, ' + run.doublons + ' doublons.');
  log('Collecte simulée : ' + run.nouveaux + ' nouveaux / ' + run.doublons + ' doublons.', run.doublons > 0 ? 'warn' : 'ok');
  toast('Collecte simulée : ' + run.nouveaux + ' nouveaux, ' + run.doublons + ' doublons écartés.', 'ok');
  save(); refreshCounts(); render();
}

/* ================================================================
   MODIFICATION 2 : runCollect utilise DB.sources au lieu de REAL_FEEDS
   ================================================================ */
async function runCollect(trigger) {
  if (!can('collect')) { toast('Rôle insuffisant pour lancer une collecte.', 'err'); return; }
  if (DB.settings.testMode) return runCollectSimulee(trigger);

  const run = { id: uid(), ts: nowISO(), trigger, items: 0, nouveaux: 0, doublons: 0, nonIdentifies: 0 };
  let feedsOk = 0, feedsKo = 0;

  const activeSources = (DB.sources || []).filter(s => s.actif !== false);
  if (activeSources.length === 0) {
    toast('Aucun flux actif configuré. Ajoutez des flux dans l\'onglet Collecte.', 'err');
    return;
  }

  for (const src of activeSources) {
    try {
      const resp = await fetch('/api/collect?feed=' + encodeURIComponent(src.feed));
      const data = await resp.json();
      if (data.error || !data.items) {
        feedsKo++;
        log('Flux en échec : ' + src.nom + ' (' + (data.error || 'vide') + ')', 'warn');
        continue;
      }
      feedsOk++;
      run.items += data.items.length;
      data.items.forEach(it => ingestCandidate({
        titre: it.titre, url: it.url, desc: it.desc, date: it.date
      }, src.id, run));
    } catch (e) {
      feedsKo++;
      log('Erreur réseau sur le flux : ' + src.nom + ' (' + e.message + ')', 'err');
    }
  }
  DB.collectes.unshift(run);
  audit('Collecte RÉELLE (' + trigger + ')',
    run.nouveaux + ' nouveaux, ' + run.doublons + ' doublons, ' + feedsOk + ' flux OK, ' + feedsKo + ' échecs.');
  log('Collecte réelle : ' + feedsOk + ' flux OK, ' + feedsKo + ' en échec, ' + run.nouveaux + ' nouveaux candidats.', feedsKo > 0 ? 'warn' : 'ok');
  toast('Collecte réelle : ' + run.nouveaux + ' nouveaux (' + feedsOk + ' flux OK).', feedsKo > 0 ? 'err' : 'ok');
  save(); refreshCounts(); render();
}

/* ---------- 6. CONTRÔLE DES LIENS ---------- */
let linkBusy = false;
async function checkLink(l) {
  if (!l || !l.url) { console.warn('[checkLink] Lien indéfini ou sans URL'); return 'error'; }
  let res, detail = null;
  if (DB.settings.testMode) {
    await new Promise(r => setTimeout(r, 60 + Math.random() * 140));
    res = Math.random() < 0.85 ? 'responds' : 'error';
  } else {
    try {
      const resp = await fetch('/api/check-link?url=' + encodeURIComponent(l.url));
      const d = await resp.json();
      res = d.ok ? 'responds' : 'error';
      detail = d;
    } catch (e) { res = 'error'; }
  }
  l.dernier = { ts: nowISO(), res, detail };
  l.hist.unshift({ ts: nowISO(), res });
  if (l.hist.length > 8) l.hist.pop();
  return res;
}
async function runLinkCheck(batch) {
  batch = batch || 12;
  if (linkBusy) { toast('Une vérification est déjà en cours.', 'err'); return; }
  if (!can('linkcheck')) { toast('Rôle insuffisant pour vérifier les liens.', 'err'); return; }
  linkBusy = true;
  const todo = [...DB.liens].sort((a, b) => {
    const pa = a.statut === 'a_verifier' ? 0 : 1, pb = b.statut === 'a_verifier' ? 0 : 1;
    if (pa !== pb) return pa - pb;
    return (a.dernier ? 1 : 0) - (b.dernier ? 1 : 0);
  }).slice(0, batch);
  log('Vérification ' + (DB.settings.testMode ? 'simulée' : 'réelle') + ' d\'un lot de ' + todo.length + ' liens…', 'info');
  let ok = 0, ko = 0;
  for (const l of todo) {
    const r = await checkLink(l);
    if (r === 'responds') ok++; else ko++;
    if (currentView === 'liens') renderLiensTable();
    await new Promise(r2 => setTimeout(r2, 50));
  }
  linkBusy = false;
  save();
  audit('Contrôle des liens', 'Lot de ' + todo.length + ' : ' + ok + ' OK, ' + ko + ' en erreur (' + (DB.settings.testMode ? 'simulation' : 'réel') + ').');
  log('Contrôle terminé : ' + ok + ' OK, ' + ko + ' en erreur.', ko > 0 ? 'warn' : 'ok');
  toast('Vérification : ' + ok + ' répondent, ' + ko + ' en erreur.', ko > 0 ? 'err' : 'ok');
  refreshCounts(); render();
}

function watchBO() {

  const actives = OEUVRES.filter(o => o.statut === 'Au programme');
  if (!actives.length) { toast('Aucune œuvre active à renouveler.', 'err'); return; }

  victim.statut = 'Sortante (renouvellement)';
  const oldP = DB.settings.currentProgram;
  DB.settings.currentProgram = DB.settings.nextProgram;
  const parts = DB.settings.nextProgram.split('-');
  DB.settings.nextProgram = (parseInt(parts[0], 10) + 1) + '-' + (parseInt(parts[1], 10) + 1);
  DB.watch.unshift({ ts: nowISO(), type: 'BO', message: 'Publication détectée : programme ' + DB.settings.currentProgram + '. « ' + victim.titre + ' » (' + victim.auteur + ') sort du programme.' });
  let flagged = 0;
  DB.inbox.forEach(it => { if (it.oeuvreIds.indexOf(victim.id) >= 0) { it.obsolete = true; flagged++; } });
  audit('Veille BO', 'Programme ' + oldP + ' → ' + DB.settings.currentProgram + '. ' + flagged + ' analyse(s) à revalider.');
  log('⚑ Veille BO : ' + DB.settings.currentProgram + ' détecté. ' + flagged + ' analyses obsolètes.', 'warn');
  toast('Veille BO : « ' + victim.titre + ' » sortante. ' + flagged + ' analyse(s) à revalider.', 'ok');
  save(); refreshCounts(); render();
}

/* ================================================================
   MODIFICATION 3 : Gestion des flux RSS (testFeed, addFeed, removeFeed, toggleFeed, testFeedUI)
   ================================================================ */
function testFeed(feedUrl) {
  return fetch('/api/collect?feed=' + encodeURIComponent(feedUrl))
    .then(resp => resp.json())
    .then(data => {
      if (data.error) return { ok: false, error: data.error };
      if (!data.items || data.items.length === 0) return { ok: false, error: 'Flux vide' };
      return { ok: true, count: data.items.length, titre: data.titre || '(flux)' };
    })
    .catch(e => ({ ok: false, error: e.message }));
}

function addFeed() {
  if (!can('feeds')) { toast('Rôle insuffisant.', 'err'); return; }
  const nomEl = $('#newFeedNom');
  const urlEl = $('#newFeedUrl');
  if (!nomEl || !urlEl) return;
  const nom = nomEl.value.trim();
  const feed = urlEl.value.trim();
  if (!nom || !feed) { toast('Nom et URL du flux requis.', 'err'); return; }
  if (!/^https?:\/\//i.test(feed)) { toast('URL invalide : doit commencer par http:// ou https://', 'err'); return; }
  const id = 'feed-' + uid();
  DB.sources.push({ id, nom, feed, actif: true });
  audit('Flux ajouté', '« ' + nom + ' » ajouté à la liste.');
  log('Flux ajouté : ' + nom + ' → ' + feed, 'ok');
  toast('Flux « ' + nom + ' » ajouté. Testez-le avant de lancer une collecte.', 'ok');
  nomEl.value = '';
  urlEl.value = '';
  save(); render();
}

function removeFeed(id) {
  if (!can('feeds')) { toast('Rôle insuffisant.', 'err'); return; }
  if (!confirm('Supprimer ce flux de la liste ?')) return;
  const idx = DB.sources.findIndex(s => s.id === id);
  if (idx >= 0) {
    const nom = DB.sources[idx].nom;
    DB.sources.splice(idx, 1);
    audit('Flux supprimé', '« ' + nom + ' » retiré de la liste.');
    save(); render();
    toast('Flux « ' + nom + ' » supprimé.', 'ok');
  }
}

function toggleFeed(id) {
  if (!can('feeds')) { toast('Rôle insuffisant.', 'err'); return; }
  const src = DB.sources.find(s => s.id === id);
  if (src) {
    src.actif = !src.actif;
    audit('Flux ' + (src.actif ? 'activé' : 'désactivé'), '« ' + src.nom + ' »');
    save(); render();
  }
}

async function testFeedUI(id) {
  const src = DB.sources.find(s => s.id === id);
  if (!src) return;
  const btn = document.querySelector('[data-test-feed="' + id + '"]');
  if (btn) { btn.disabled = true; btn.textContent = 'Test…'; }
  const result = await testFeed(src.feed);
  if (result.ok) {
    toast('✓ Flux « ' + src.nom + ' » OK : ' + result.count + ' éléments (' + result.titre + ')', 'ok');
  } else {

  }

async function testAllFeeds() {
  if (!can('feeds')) { toast('Rôle insuffisant.', 'err'); return; }
  const sources = DB.sources || [];
  if (sources.length === 0) { toast('Aucun flux à tester.', 'err'); return; }
  toast('Test de ' + sources.length + ' flux en cours…');
  let ok = 0, ko = 0;
  for (const src of sources) {
    const r = await testFeed(src.feed);
    if (r.ok) { ok++; log('✓ Test flux ' + src.nom + ' : ' + r.count + ' éléments', 'ok'); }
    else { ko++; log('✗ Test flux ' + src.nom + ' : ' + r.error, 'err'); }
  }
  toast('Test terminé : ' + ok + ' OK, ' + ko + ' en erreur.', ko > 0 ? 'err' : 'ok');
  audit('Test des flux', ok + ' flux OK, ' + ko + ' en erreur.');
}

/* ---------- 8. SOURCES CANDIDATES ---------- */
function detectSources() {
  if (!can('approve')) { toast('Rôle insuffisant.', 'err'); return; }
  const known = new Set(DB.candidats.map(c => c.id));
  const pick = CAND_POOL.filter(c => !known.has(c.id)).slice(0, 2);
  if (!pick.length) { toast('Toutes les sources candidates connues sont déjà dans la file.', 'err'); return; }
  pick.forEach(c => DB.candidats.push(Object.assign({}, c, { ts: nowISO(), statut: 'pendant' })));
  audit('Détection de sources', pick.length + ' source(s) candidate(s) ajoutée(s).');
  toast(pick.length + ' source(s) candidate(s) détectée(s).', 'ok');
  save(); refreshCounts(); render();
}
function approveSource(id, ok) {
  if (!can('approve')) { toast('Rôle insuffisant.', 'err'); return; }
  const c = DB.candidats.find(x => x.id === id); if (!c) return;
  if (ok) {
    c.statut = 'approuvee';
    audit('Source approuvée', '« ' + c.nom + ' » intégrée aux sources candidates.');
    toast('« ' + c.nom + ' » approuvée.', 'ok');
  } else {
    c.statut = 'refusee';
    audit('Source refusée', '« ' + c.nom + ' » écartée.');
    toast('« ' + c.nom + ' » refusée.');
  }
  save(); refreshCounts(); render();
}

/* ---------- 10. PLANIFICATEUR ---------- */
let schedTimer = null, countTimer = null;
async function scheduledTick() {
  log('⏰ Exécution planifiée (intervalle ' + DB.settings.freq + ' min).', 'info');
  if (DB.settings.autoCollect) await runCollect('programmée');
  if (DB.settings.autoLinks) await runLinkCheck(12);
  DB.settings.nextRun = Date.now() + DB.settings.freq * 60000;
  save(); updateSchedUI();
}
function startSched() {
  stopSched();
  DB.settings.actif = true;
  DB.settings.nextRun = Date.now() + DB.settings.freq * 60000;
  schedTimer = setInterval(scheduledTick, DB.settings.freq * 60000);
  countTimer = setInterval(updateSchedUI, 1000);
  audit('Planificateur', 'Activé (' + DB.settings.freq + ' min).');
  log('Planificateur activé (' + DB.settings.freq + ' min).', 'ok');
  save(); updateSchedUI(); toast('Planificateur activé.', 'ok');
}
function stopSched() {
  if (schedTimer) clearInterval(schedTimer);
  if (countTimer) clearInterval(countTimer);
  schedTimer = null; countTimer = null;
  DB.settings.actif = false; DB.settings.nextRun = null;
  save(); updateSchedUI();
}
function updateSchedUI() {
  const mini = $('#schedMini'); if (!mini) return;
  if (DB.settings.actif && DB.settings.nextRun) {
    const s = Math.max(0, Math.floor((DB.settings.nextRun - Date.now()) / 1000));
    const m = String(Math.floor(s / 60)).padStart(2, '0'), ss = String(s % 60).padStart(2, '0');
    mini.innerHTML = 'Planificateur : <b>actif</b> · prochaine exéc. <b>' + m + ':' + ss + '</b>';
    const cd = $('#countdown'); if (cd) cd.textContent = 'Prochaine exécution automatique dans ' + m + ':' + ss;
  } else {
    mini.innerHTML = 'Planificateur : <b>arrêté</b>';
    const cd = $('#countdown'); if (cd) cd.textContent = 'Planificateur arrêté.';
  }
}

/* ---------- 11. DIGEST ---------- */
function buildDigest() {
  const pubs = DB.inbox.filter(i => i.statut === 'publiee');
  let md = '# Digest EAF — ' + new Date().toLocaleDateString('fr-FR') + '\n\nProgramme : ' + DB.settings.currentProgram + ' · ' + pubs.length + ' analyses publiées.\n\n';
  OEUVRES.forEach(o => {
    const items = pubs.filter(i => i.oeuvreIds.indexOf(o.id) >= 0);
    if (items.length) {
      md += '## ' + o.titre + ' (' + o.auteur + ') — ' + OBJETS[o.objet].l + ', voie ' + o.voie + '\n';
      items.forEach(i => { md += '- [' + i.titre + '](' + i.url + ') · ' + i.format + ' · ' + i.exercice + ' · via ' + i.source + '\n'; });
      md += '\n';
    }
  });
  const sans = OEUVRES.filter(o => !pubs.some(i => i.oeuvreIds.indexOf(o.id) >= 0));
  if (sans.length) md += '## ⚠️ Œuvres sans analyse publiée\n' + sans.map(o => '- ' + o.titre + ' (' + o.auteur + ')\n').join('') + '\n';
  return md;
}

/* ---------- 12. DIAGNOSTIC ---------- */
async function runDiagnostics() {
  const box = $('#diagResults'); if (!box) return;
  const btn = $('#btnDiag'); if (btn) btn.disabled = true;
  const res = [];
  const add = (name, ok, detail) => {
    res.push({ name, ok, detail });
    box.innerHTML = res.map(r =>
      '<div class="diag-row"><span class="diag-ico ' + (r.ok ? 'diag-ok' : 'diag-ko') + '">' +
      (r.ok ? '✓' : '✗') + '</span><b>' + esc(r.name) +
      '</b><span class="muted small" style="margin-left:auto">' + esc(r.detail) + '</span></div>'
    ).join('');
  };

  add('Référentiel œuvres', OEUVRES.length === 16, OEUVRES.length + ' œuvres');
  add('Whitelist liens', DB.liens.length >= 20, DB.liens.length + ' liens');
  add('Étiquetage par mots-clés', matchOeuvres({ t: 'La Peau de chagrin, incipit', x: 'Balzac' }).indexOf('balzac') >= 0, 'œuvre détectée');
  add('Dédoublonnage (empreinte)', normFP('https://www.example.com/page?x=1', 't', 's') === normFP('http://example.com/page', 't', 's'), 'URL équivalentes → même empreinte');
  const sc = composite({ date: nowISO().slice(0, 10), source: 'lumni', oeuvreIds: ['balzac'] });
  add('Score composite', sc >= 0 && sc <= 10, 'score ' + sc + '/10');
  add('Matrice des permissions', PERMS.admin.indexOf('publish') >= 0 && PERMS.lecture.indexOf('publish') < 0, 'admin peut publier, lecture seule non');
  add('Liste des flux RSS', Array.isArray(DB.sources) && DB.sources.length > 0, (DB.sources || []).length + ' flux configurés');

  try {
    const r = await fetch('/api/load-data');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    add('Connectivité Supabase', data && data.state && data.state.version === 3, 'état chargé (v' + (data.state ? data.state.version : '?') + ')');
  } catch (e) { add('Connectivité Supabase', false, e.message); }

  try {
    const r = await fetch('/api/check-link?url=' + encodeURIComponent('https://example.com'));
    const d = await r.json();
    add('Fonction /api/check-link', d && typeof d.ok === 'boolean', d.ok ? 'example.com répond' : 'erreur');
  } catch (e) { add('Fonction /api/check-link', false, e.message); }

  try {
    const firstFeed = (DB.sources || []).find(s => s.actif !== false);
    if (firstFeed) {
      const r = await fetch('/api/collect?feed=' + encodeURIComponent(firstFeed.feed));
      const d = await r.json();
      add('Fonction /api/collect (flux réel)',
        d && !d.error && Array.isArray(d.items) && d.items.length > 0,
        d.error ? d.error : (d.items ? d.items.length + ' éléments' : 'vide'));
    } else {
      add('Fonction /api/collect (flux réel)', false, 'aucun flux actif configuré');
    }
  } catch (e) { add('Fonction /api/collect (flux réel)', false, e.message); }

  const prevMode = DB.settings.testMode;
  DB.settings.testMode = true;
  if (DB.liens.length > 0) {
    const l = DB.liens[0]; const r = await checkLink(l);
    add('Contrôle d\'un lien (simulation)', r === 'responds' || r === 'error', 'retour : ' + r);
  } else {
    add('Contrôle d\'un lien (simulation)', false, 'aucun lien (base réparée au prochain chargement)');
  }
  DB.settings.testMode = prevMode; save();

  const md = buildDigest();
  add('Génération du digest', md.indexOf('Digest EAF') >= 0, 'Markdown produit');
  add('Export JSON', JSON.stringify(DB).length > 100, 'sérialisation OK');

  const okN = res.filter(x => x.ok).length;
  toast('Diagnostic : ' + okN + '/' + res.length + ' tests réussis.', okN === res.length ? 'ok' : 'err');
  if (btn) btn.disabled = false;
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'curation-eaf-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  audit('Export', 'Sauvegarde JSON exportée.');
  toast('Export téléchargé.', 'ok');
}
function importJSON(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = function () {
    try {
      const obj = JSON.parse(rd.result);
      if (!obj || obj.version !== 3 || !obj.liens) throw new Error('format');
      DB = normalizeState(obj); save();
      audit('Import', 'Base restaurée depuis une sauvegarde.');
      toast('Import réussi.', 'ok');
      refreshCounts(); render();
    } catch (e) { toast('Fichier invalide.', 'err'); }
  };
  rd.readAsText(file);
}

function setupListeners() {
  $('#nav').addEventListener('click', function (e) { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
  $('#rolePick').addEventListener('change', function (e) {
    DB.role = e.target.value; save();
    audit('Changement de rôle', 'Rôle actif : ' + roleName[DB.role]);
    toast('Rôle : ' + roleName[DB.role]); render();
  });
  $('#btnCollectNow').addEventListener('click', function () { runCollect('manuelle'); });
  $('#btnLinksNow').addEventListener('click', function () { runLinkCheck(12); });

  document.addEventListener('click', function (e) {
    try {
      let el;
      if ((el = e.target.closest('[data-move]'))) { moveItem(el.dataset.move, el.dataset.to); return; }
      if ((el = e.target.closest('[data-test]'))) {
        const l = DB.liens.find(x => x.id === el.dataset.test);
        if (l) checkLink(l).then(function () { save(); renderLiensTable(); });
        return;
      }
      if ((el = e.target.closest('[data-lf]'))) { lienFiltre = el.dataset.lf; render(); return; }
      if ((el = e.target.closest('[data-if]'))) { inboxFiltre = el.dataset.if; render(); return; }
      if ((el = e.target.closest('[data-rappok]'))) { const r = DB.rapports.find(x => x.id === el.dataset.rappok); if (r) { r.statut = 'traité'; audit('Signalement traité', r.type); save(); render(); refreshCounts(); } return; }
      if ((el = e.target.closest('[data-rappko]'))) { const r = DB.rapports.find(x => x.id === el.dataset.rappko); if (r) { r.statut = 'ignoré'; save(); render(); refreshCounts(); } return; }
      if ((el = e.target.closest('[data-approve]'))) { approveSource(el.dataset.approve, true); return; }
      if ((el = e.target.closest('[data-refuse]'))) { approveSource(el.dataset.refuse, false); return; }
      /* ✅ Écouteurs flux RSS */
      if (e.target.closest('#btnAddFeed')) { addFeed(); return; }
      if (e.target.closest('#btnTestAllFeeds')) { testAllFeeds(); return; }
      if ((el = e.target.closest('[data-remove-feed]'))) { removeFeed(el.dataset.removeFeed); return; }
      if ((el = e.target.closest('[data-test-feed]'))) { testFeedUI(el.dataset.testFeed); return; }
      if (e.target.closest('#btnCheckLot')) { runLinkCheck(12); return; }
      if (e.target.closest('#btnCollectNow2')) { runCollect('manuelle'); return; }
      if (e.target.closest('#btnStartSched')) { const fi = $('#freqInput'); DB.settings.freq = Math.max(1, parseInt(fi ? fi.value : DB.settings.freq, 10) || 30); startSched(); render(); return; }
      if (e.target.closest('#btnStopSched')) { stopSched(); audit('Planificateur', 'Arrêté.'); toast('Planificateur arrêté.'); render(); return; }
      if (e.target.closest('#btnWatchBO')) { watchBO(); return; }
      if (e.target.closest('#btnDetectSources')) { detectSources(); return; }
      if (e.target.closest('#btnDigest')) { DB.settings.lastDigest = nowISO(); audit('Digest', 'Généré.'); save(); renderDigest(); toast('Digest généré.', 'ok'); return; }
      if (e.target.closest('#btnCopyDigest')) { navigator.clipboard.writeText(buildDigest()).then(function () { toast('Digest copié (Markdown).', 'ok'); }, function () { toast('Copie impossible.', 'err'); }); return; }
      if (e.target.closest('#btnExportDigest')) { const blob = new Blob([buildDigest()], { type: 'text/markdown' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'digest-eaf.md'; a.click(); URL.revokeObjectURL(a.href); toast('Digest exporté.', 'ok'); return; }
      if (e.target.closest('#btnRapp')) {
        const linkId = $('#rappLink').value, type = $('#rappType').value, msg = $('#rappMsg').value.trim();
        if (!msg) { toast('Précisez la description.', 'err'); return; }
        DB.rapports.unshift({ id: uid(), ts: nowISO(), linkId, type, msg, by: roleName[DB.role], statut: 'ouvert' });
        const lk = DB.liens.find(l => l.id === linkId);
        audit('Signalement', type + ' sur ' + (lk ? lk.titre : linkId));
        save(); render(); refreshCounts(); toast('Signalement enregistré.', 'ok'); return;
      }
      if (e.target.closest('#btnDiag')) { runDiagnostics(); return; }
      if (e.target.closest('#btnExport')) { exportJSON(); return; }
      if (e.target.closest('#btnImport')) { if (can('import')) $('#fileImport').click(); else toast('Réservé à l\'Administrateur.', 'err'); return; }
      if (e.target.closest('#btnReset')) {
        if (can('reset') && confirm('Réinitialiser toute la base de curation ? (Supabase écrasé au prochain save)')) {
          DB = seed(); save(); toast('Base réinitialisée.', 'ok'); render(); refreshCounts();
        }
        return;
      }
    } catch (err) { toast('Erreur : ' + err.message, 'err'); }
  });

  document.addEventListener('change', function (e) {
    try {
      if (e.target.id === 'swCollect') { DB.settings.autoCollect = e.target.checked; save(); audit('Réglage', 'Collecte auto : ' + (e.target.checked ? 'on' : 'off')); }
      if (e.target.id === 'swLinks') { DB.settings.autoLinks = e.target.checked; save(); audit('Réglage', 'Liens auto : ' + (e.target.checked ? 'on' : 'off')); }
      if (e.target.id === 'swTestMode') {
        DB.settings.testMode = e.target.checked; save();
        audit('Réglage', 'Mode test : ' + (e.target.checked ? 'simulation' : 'réseau réel'));
        toast('Mode ' + (e.target.checked ? 'Simulation' : 'Réseau réel') + ' activé.');
      }
      if (e.target.id === 'freqInput') { DB.settings.freq = Math.max(1, parseInt(e.target.value, 10) || 30); save(); if (DB.settings.actif) startSched(); }
      /* ✅ Écouteur toggle flux */
      let el;
      if ((el = e.target.closest('[data-toggle-feed]'))) { toggleFeed(el.dataset.toggleFeed); }
      if (e.target.id === 'fileImport') { importJSON(e.target.files[0]); e.target.value = ''; }
    } catch (err) { toast('Erreur : ' + err.message, 'err'); }
  });
}

/* ================================================================
   MODIFICATION 6 : normalizeState inclut sources
   ================================================================ */
function normalizeState(saved) {
  const base = seed();
  const st = Object.assign({}, base, saved || {});
  st.settings = Object.assign({}, base.settings, (saved && saved.settings) || {});
  if (!Array.isArray(st.liens) || st.liens.length === 0) st.liens = base.liens;
  if (!Array.isArray(st.inbox)) st.inbox = [];
  if (!Array.isArray(st.collectes)) st.collectes = [];
  if (!Array.isArray(st.watch)) st.watch = [];
  if (!Array.isArray(st.candidats)) st.candidats = [];
  if (!Array.isArray(st.rapports)) st.rapports = [];
  if (!Array.isArray(st.audit) || st.audit.length === 0) st.audit = base.audit;
  if (!Array.isArray(st.log)) st.log = [];
  if (!st.fingerprints || typeof st.fingerprints !== 'object') st.fingerprints = {};
  if (!st.role) st.role = 'admin';
  if (!Array.isArray(st.sources) || st.sources.length === 0) st.sources = base.sources;
  delete st.test; delete st.timestamp; delete st.message;
  st.version = 3;
  return st;
}

/* ---------- 16. INIT ASYNCHRONE ---------- */
(async function () {
  try {
    setupListeners();
    console.log('[INIT] 🚀 Démarrage de l\'application...');
    const savedState = await Storage.init();
    if (savedState && savedState.version === 3) {
      console.log('[INIT] ✅ État chargé depuis Supabase, normalisation...');
      DB = normalizeState(savedState);
    } else {
      console.log('[INIT] 🆕 Aucun état valide, création d\'une base initiale');
      DB = seed();
    }
    Storage.write(DB);
    $('#rolePick').value = DB.role;
    updateStorageTag();
    refreshCounts();
    setView('dashboard');
    if (DB.settings.actif) { DB.settings.actif = false; save(); }
    console.log('[INIT] ✅ Application prête');
  } catch (err) {
    console.error('[INIT] ❌ Erreur critique :', err);
    document.getElementById('view').innerHTML =
      '<div class="fatal"><h2 style="font-family:Fraunces;margin-bottom:8px">⚠️ Erreur d\'initialisation</h2>' +
      '<p>' + esc(err.message) + '</p>' +
      '<p class="small muted" style="margin-top:12px">Vérifiez que les variables <span class="mono">SUPABASE_URL</span> et <span class="mono">SUPABASE_ANON_KEY</span> sont configurées dans Vercel, et que le schéma SQL a été exécuté dans Supabase.</p>' +
      '<button class="btn btn--red" style="margin-top:12px" onclick="location.reload()">⟲ Réessayer</button></div>';
  }
})();
</script>
